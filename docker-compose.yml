services:
  postgres:
    image: postgres:17-alpine
    container_name: hinaa-portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hinaa}
      POSTGRES_USER: ${POSTGRES_USER:-hinaa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hinaa} -d ${POSTGRES_DB:-hinaa}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - hinaa

  backend:
    build: ./backend
    container_name: hinaa-portal-backend
    restart: unless-stopped
    environment:
      APP_NAME: Hinaa
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hinaa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hinaa}
      JWT_SECRET: ${JWT_SECRET}
      FERNET_KEY: ${FERNET_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_NAME: hinaa_session
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DEFAULT_RPM_LIMIT: ${DEFAULT_RPM_LIMIT:-30}
      DEFAULT_DURATION: ${DEFAULT_DURATION:-30d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3100}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hinaa
      - litellm

  frontend:
    build: ./frontend
    container_name: hinaa-portal-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3100:3000"
    networks:
      - hinaa

networks:
  hinaa:
    name: hinaa_portal
  litellm:
    external: true
    name: litellm_default
